services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: scanguru_portal
    ports:
      - "5432:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d scanguru_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  portal:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://portal:portal@postgres:5432/scanguru_portal
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  portal_pgdata:
